<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Library · true-shuffle</title>
    <meta name="color-scheme" content="dark light">
    <link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <header class="masthead">
        <a class="wordmark" href="/">
            <span class="mark" aria-hidden="true"><i></i><i></i><i></i></span>
            true-shuffle
        </a>
        <nav>
            <a href="/library" aria-current="page">Library</a>
            <a href="/runs" >Runs</a>
            <a href="/connect" >Services</a>
            <button class="btn btn-ghost" id="themeToggle" type="button" aria-label="Switch colour theme">Theme</button>
        </nav>
    </header>

    <main class="page">
        
<section class="stack-s">
    <p class="label">Step 2 — pick a playlist</p>
    <h1>Deal a deck</h1>
    <p class="muted">Large playlists are read in the background; you can watch it happen.</p>
</section>

<div class="row">
    <div class="tabs" id="providerTabs" role="group" aria-label="Streaming service"></div>
</div>

<div class="deck-layout">
    <div class="panel">
        <div class="spread">
            <h2 style="font-size: var(--step-1)">Your playlists</h2>
            <span class="faint num small" id="plCount"></span>
        </div>
        <label class="sr-only" for="plFilter">Filter playlists</label>
        <input type="search" id="plFilter" placeholder="Filter by name…" autocomplete="off">
        <div class="pl-list" id="playlists" role="listbox" aria-label="Playlists">
            <div class="statusline"><span class="spinner"></span> Loading playlists…</div>
        </div>
        <div class="notice notice-critical hidden" id="libNotice"></div>
    </div>

    <div class="stack">
        <div class="modes" id="modeCards"></div>

        <div class="panel stack">
            <p class="label">Selected</p>
            <p class="muted small" id="selectionHint">Nothing selected yet.</p>

            <label class="stack-s small">
                <span class="faint">If a deck is already running for this playlist</span>
                <select id="reshuffle">
                    <option value="0">Continue where I left off</option>
                    <option value="1">Deal a new deck (discards the current one)</option>
                </select>
            </label>

            <button class="btn btn-primary btn-lg" id="dealBtn" type="button" disabled>Deal the deck</button>
            <div class="statusline hidden" id="jobLog"></div>
            <div class="notice hidden" id="jobResult"></div>
        </div>
    </div>
</div>

    </main>

    <script type="module" src="/static/app.js"></script>
    
<script type="module">
import { $, api, el, followJob, formatCount, setNotice } from "/static/app.js";

const PROVIDERS = [{"auth": "oauth2_pkce", "brand_color": "#1DB954", "configured": false, "create_playlist": true, "display_name": "Spotify", "experimental": false, "id": "spotify", "live_mode_needs_open_tab": false, "missing_config": ["SPOTIFY_CLIENT_ID"], "notes": ["Nothing needs to stay open \u2014 true-shuffle drives your Spotify app from the server.", "Live Mode controls an existing Spotify device and needs Premium. Open Spotify somewhere first so there is a device to take over.", "On a free account, use Handoff Mode: the deck is written as a playlist and your progress is read back from your listening history."], "playback": "remote_device", "read_playlists": true, "requires_paid_tier": true, "supports_controller_mode": true, "supports_history_sync": true, "supports_queue_prefetch": true, "tracks_progress_without_tab": true, "write_batch_size": 100}, {"auth": "browser_sdk", "brand_color": "#FA243C", "configured": false, "create_playlist": true, "display_name": "Apple Music", "experimental": false, "id": "apple", "live_mode_needs_open_tab": true, "missing_config": ["APPLE_TEAM_ID", "APPLE_KEY_ID", "APPLE_PRIVATE_KEY (or APPLE_PRIVATE_KEY_PATH)"], "notes": ["Handoff Mode needs nothing open: the deck is written to your library and your progress is read back from your Apple Music listening history.", "Live Mode plays inside this browser tab via MusicKit JS, because Apple exposes no server-side remote control \u2014 so it only runs while the tab is open.", "Library items without an Apple Music catalog entry (personal uploads) cannot be queued and are reported as skipped."], "playback": "web_player", "read_playlists": true, "requires_paid_tier": true, "supports_controller_mode": true, "supports_history_sync": true, "supports_queue_prefetch": false, "tracks_progress_without_tab": true, "write_batch_size": 50}, {"auth": "oauth2_code", "brand_color": "#FF0033", "configured": false, "create_playlist": true, "display_name": "YouTube Music", "experimental": false, "id": "youtube", "live_mode_needs_open_tab": true, "missing_config": ["YOUTUBE_CLIENT_ID", "YOUTUBE_CLIENT_SECRET"], "notes": ["Live Mode plays in this browser tab through the official YouTube player \u2014 keep the tab open while listening.", "YouTube is the one service with no playback-history API, so a deck played in the YouTube app cannot report its progress back. Live Mode is the only mode here that tracks where you are.", "Only playlists you created are visible. YouTube\u0027s auto-generated mixes (Liked Music, Supermix, \u2026) are not exposed by any public API.", "Copy Mode is limited by the YouTube API quota: each added track costs 50 of 10 000 daily units, so large playlists must use Live Mode instead."], "playback": "web_player", "read_playlists": true, "requires_paid_tier": false, "supports_controller_mode": true, "supports_history_sync": false, "supports_queue_prefetch": false, "tracks_progress_without_tab": false, "write_batch_size": 1}, {"auth": "oauth2_pkce", "brand_color": "#8a8f98", "configured": true, "create_playlist": true, "display_name": "Fake fake", "experimental": false, "id": "fake", "live_mode_needs_open_tab": false, "missing_config": [], "notes": [], "playback": "remote_device", "read_playlists": true, "requires_paid_tier": false, "supports_controller_mode": true, "supports_history_sync": false, "supports_queue_prefetch": true, "tracks_progress_without_tab": true, "write_batch_size": 10}];
const CONNECTED = ["fake"];

const byId = Object.fromEntries(PROVIDERS.map((p) => [p.id, p]));
const state = { provider: CONNECTED[0] || null, mode: null, playlist: null, all: [] };

/* -- service tabs --------------------------------------------------------- */

$("#providerTabs").replaceChildren(
    ...CONNECTED.map((id) =>
        el("button", {
            type: "button",
            dataset: { provider: id },
            "aria-pressed": String(id === state.provider),
            onClick: () => selectProvider(id),
        }, byId[id]?.display_name || id))
);

function selectProvider(id) {
    state.provider = id;
    state.playlist = null;
    state.mode = null;
    for (const b of $("#providerTabs").children) {
        b.setAttribute("aria-pressed", String(b.dataset.provider === id));
    }
    $("#dealBtn").disabled = true;
    $("#selectionHint").textContent = "Nothing selected yet.";
    renderModes();
    loadPlaylists();
}

/* -- modes ---------------------------------------------------------------- */

/**
 * Build the two mode cards for the selected service.
 * The card states, in the service's own terms, whether anything has to stay
 * open — that is the question people actually care about.
 */
function renderModes() {
    const p = byId[state.provider];
    if (!p) return;

    const options = [
        {
            id: "utility",
            title: "Handoff Mode",
            available: p.create_playlist,
            tabFree: p.supports_history_sync,
            body: p.supports_history_sync
                ? `The deck is written into ${p.display_name} as a playlist. Play it there — phone, car, speaker — and true-shuffle reads your listening history back to keep your place.`
                : `The deck is written into ${p.display_name} as a playlist and you play it there. ${p.display_name} has no listening-history API, so your position cannot be tracked afterwards.`,
            note: p.id === "youtube"
                ? "YouTube charges 50 API quota units per added track, so only small playlists can be written this way."
                : null,
        },
        {
            id: "controller",
            title: "Live Mode",
            available: p.supports_controller_mode,
            tabFree: !p.live_mode_needs_open_tab,
            body: p.live_mode_needs_open_tab
                ? `Plays through ${p.display_name}'s own player in this browser tab, and moves the deck on every track end and skip. ${p.display_name} lets nothing else control playback, so this only runs while the tab is open.`
                : `true-shuffle takes over the ${p.display_name} app you already have open and moves the deck on every track end and skip — including skips you make in ${p.display_name} itself. Runs on the server, so you can close this page.`,
            note: p.requires_paid_tier ? `Requires a paid ${p.display_name} subscription.` : null,
        },
    ];

    // Default to whichever available mode needs nothing open.
    if (!state.mode) {
        const preferred = options.find((o) => o.available && o.tabFree)
            || options.find((o) => o.available);
        state.mode = preferred?.id || null;
    }

    $("#modeCards").replaceChildren(...options.map((o) =>
        el("button", {
            class: "mode",
            type: "button",
            "aria-pressed": String(state.mode === o.id),
            disabled: !o.available || null,
            onClick: () => { state.mode = o.id; renderModes(); },
        },
            el("div", { class: "spread" },
                el("h3", {}, o.title),
                el("span", {
                    class: `badge-tab ${o.tabFree ? "badge-tab-free" : "badge-tab-open"}`,
                }, o.tabFree ? "Nothing stays open" : "Keep this tab open")),
            el("p", {}, o.body),
            o.note ? el("p", { class: "faint small" }, o.note) : null,
            !o.available ? el("p", { class: "faint small" }, `Not available on ${p.display_name}.`) : null
        )));
}

/* -- playlists ------------------------------------------------------------ */

async function loadPlaylists() {
    const list = $("#playlists");
    list.replaceChildren(el("div", { class: "statusline" },
        el("span", { class: "spinner" }), "Loading playlists…"));
    setNotice($("#libNotice"), "");

    try {
        const { playlists } = await api(`/api/playlists?provider=${state.provider}`);
        state.all = playlists;
        renderPlaylists();
    } catch (err) {
        list.replaceChildren();
        setNotice($("#libNotice"), err.message, "notice-critical");
    }
}

function renderPlaylists() {
    const term = $("#plFilter").value.trim().toLowerCase();
    const shown = term
        ? state.all.filter((p) => (p.name || "").toLowerCase().includes(term))
        : state.all;

    $("#plCount").textContent = term
        ? `${formatCount(shown.length)} of ${formatCount(state.all.length)}`
        : `${formatCount(state.all.length)} playlists`;

    const list = $("#playlists");
    if (!shown.length) {
        list.replaceChildren(el("div", { class: "empty" },
            state.all.length ? "No playlist matches that filter."
                             : "No playlists found on this account."));
        return;
    }

    list.replaceChildren(...shown.map((pl) =>
        el("button", {
            class: "pl",
            type: "button",
            role: "option",
            "aria-selected": String(state.playlist?.id === pl.id),
            onClick: (ev) => selectPlaylist(pl, ev.currentTarget),
        },
            pl.image_url ? el("img", { src: pl.image_url, alt: "", loading: "lazy" })
                         : el("span", { class: "ph" }),
            el("span", { class: "meta" },
                el("b", {}, pl.name || "Untitled"),
                el("span", { class: "faint small" },
                    pl.track_count >= 0 ? `${formatCount(pl.track_count)} tracks` : "size unknown")),
            el("span", { class: "n" }, pl.track_count >= 0 ? formatCount(pl.track_count) : "—")
        )));
}

$("#plFilter").addEventListener("input", renderPlaylists);

function selectPlaylist(playlist, node) {
    state.playlist = playlist;
    for (const option of $("#playlists").children) option.setAttribute?.("aria-selected", "false");
    node.setAttribute("aria-selected", "true");
    $("#dealBtn").disabled = !state.mode;
    $("#selectionHint").textContent =
        `${playlist.name} — ${playlist.track_count >= 0 ? formatCount(playlist.track_count) + " tracks" : "size counted while reading"}.`;
}

/* -- dealing -------------------------------------------------------------- */

$("#dealBtn").addEventListener("click", async () => {
    if (!state.playlist || !state.mode) return;
    const button = $("#dealBtn");
    const log = $("#jobLog");

    button.disabled = true;
    setNotice($("#jobResult"), "");
    log.classList.remove("hidden");
    log.replaceChildren(el("span", { class: "spinner" }), "Starting…");

    try {
        const { job_id } = await api("/api/runs", {
            method: "POST",
            body: {
                provider: state.provider,
                playlist_id: state.playlist.id,
                mode: state.mode,
                reshuffle: $("#reshuffle").value === "1",
            },
        });

        followJob(job_id, {
            onProgress: (frame) => {
                const detail = frame.total
                    ? `${frame.phase} — ${formatCount(frame.processed)} of ${formatCount(frame.total)}`
                    : frame.phase || "working…";
                log.replaceChildren(el("span", { class: "spinner" }), detail);
            },
            onDone: (result) => {
                log.classList.add("hidden");
                button.disabled = false;
                if (state.mode === "controller") {
                    location.href = `/player/${result.run_id}`;
                    return;
                }
                showHandoffResult(result);
            },
            onError: (err) => {
                log.classList.add("hidden");
                button.disabled = false;
                setNotice($("#jobResult"), err.message, "notice-critical");
            },
        });
    } catch (err) {
        log.classList.add("hidden");
        button.disabled = false;
        setNotice($("#jobResult"), err.message, "notice-critical");
    }
});

function showHandoffResult(result) {
    const box = $("#jobResult");
    box.className = "notice notice-ok";
    box.classList.remove("hidden");
    box.replaceChildren(
        el("strong", {}, `“${result.copy_playlist_name}” is ready`),
        el("span", {}, `${formatCount(result.written)} tracks in true-shuffle order.` +
            (result.skipped
                ? ` ${formatCount(result.skipped)} entries were left out — local files, unavailable tracks or duplicates.`
                : " Nothing had to be left out.")),
        el("span", { class: "faint" }, result.tracked
            ? "Play it in the app. Your position is picked up from your listening history — nothing needs to stay open."
            : "Play it in the app. This service exposes no listening history, so your position is not tracked."),
        el("span", { class: "row", style: "margin-top: 6px" },
            result.copy_playlist_url
                ? el("a", { class: "btn", href: result.copy_playlist_url, target: "_blank", rel: "noopener" }, "Open the playlist")
                : null,
            el("a", { class: "btn btn-ghost", href: "/runs" }, "All runs"))
    );
}

if (state.provider) { renderModes(); loadPlaylists(); }
</script>

</body>
</html>
