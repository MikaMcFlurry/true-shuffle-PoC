# fly.toml app configuration file generated for true-shuffle-poc on 2026-07-30T21:46:44Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'true-shuffle-poc'
primary_region = 'fra'

[build]

[env]
  DB_PATH = '/data/true_shuffle.db'
  LOG_LEVEL = 'INFO'

[[mounts]]
  source = 'true_shuffle_data'
  destination = '/data'

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1

  [http_service.concurrency]
    type = 'requests'
    hard_limit = 80
    soft_limit = 40

  [[http_service.checks]]
    interval = '30s'
    timeout = '5s'
    grace_period = '10s'
    method = 'GET'
    path = '/health'

[[vm]]
  size = 'shared-cpu-1x'
  memory = '512mb'
