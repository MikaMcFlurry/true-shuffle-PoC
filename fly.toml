# fly.toml — true-shuffle
#
# Rename `app` below to something free, then:  fly launch --no-deploy  (or
# `fly apps create <name>`), `fly volumes create ...`, `fly secrets set ...`,
# `fly deploy`. The full walkthrough is in DEPLOY.md.

app = "true-shuffle-mvp"
primary_region = "fra"          # Frankfurt — nearest to Bayreuth

[build]

[env]
  # Must match the redirect URI registered with Spotify, exactly.
  # Change this together with the app name above.
  BASE_URL = "https://true-shuffle-mvp.fly.dev"
  DB_PATH  = "/data/true_shuffle.db"
  LOG_LEVEL = "INFO"

# The deck, the tokens and every run live here. Without a volume a redeploy
# wipes all of it, because the container filesystem is rebuilt each time.
[mounts]
  source = "true_shuffle_data"
  destination = "/data"

[http_service]
  internal_port = 8000
  force_https = true

  # BOTH of these matter, and neither is about cost:
  #
  # auto_stop_machines = false — a stopped machine runs no watcher. A listener
  #   who starts a run and closes the tab would find the deck exactly where
  #   they left it an hour later, which is the one promise this product makes.
  #
  # min/max = 1 — advance_lock() is an in-process asyncio.Lock. A second
  #   machine would not see it, and two machines could burn two cards for one
  #   song. One machine is a correctness requirement, not a budget one.
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1
  max_machines_running = 1

  [http_service.concurrency]
    type = "requests"
    soft_limit = 40
    hard_limit = 80

  [[http_service.checks]]
    grace_period = "10s"
    interval = "30s"
    method = "GET"
    path = "/health"
    timeout = "5s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
