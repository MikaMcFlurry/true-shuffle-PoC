name: Cloudflare application checks

on:
  pull_request:
    branches: [codex/cloudflare-restart-plan, codex/implement-cloudflare-restart]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      WRANGLER_SEND_METRICS: "false"
      GOMAXPROCS: "2"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - run: npx wrangler deploy --dry-run --outdir /tmp/true-shuffle-worker
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-failure-evidence
          path: e2e/.artifacts/results
          retention-days: 7
